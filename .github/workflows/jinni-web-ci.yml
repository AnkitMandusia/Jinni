name: Jinni Web Portal CI

on:
  pull_request:
    branches: [main]
    paths:
      - "superapp-admin/**"
      - ".github/workflows/jinni-web-ci.yml"
  push:
    branches: [feature/web-partner-dashboards]
    paths:
      - "superapp-admin/**"
      - ".github/workflows/jinni-web-ci.yml"

permissions:
  contents: read

jobs:
  build:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: superapp-admin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: superapp-admin/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build web portal
        run: npm run build
