# Jinni — full stack: Postgres, Redis, DB migrations, API, admin web.
#   cp .env.docker.example .env   # fill in
#   docker compose up -d --build
#   open http://localhost:8080    (admin + proxied API)
name: jinni

# Real credentials (Paytm, Firebase API key, R2, SMS, Gemini, JWT secret, ...) are read from
# superapp-backend/.env — the same file used for local (non-Docker) runs. Only the keys below
# are forced because they must point at the containers instead of localhost.
x-api-env: &api-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jinni}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-jinni}
  REDIS_URL: redis://redis:6379/0
  FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase-credentials.json   # file goes in ./secrets/
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
  DEBUG: ${DEBUG:-false}

x-api-envfile: &api-envfile
  - path: ./superapp-backend/.env
    required: true

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jinni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-jinni}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jinni} -d ${POSTGRES_DB:-jinni}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF so rate-limit/OTP state survives a restart; bounded memory.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: applies Alembic migrations, then exits. api waits for it to succeed.
  migrate:
    build: ./superapp-backend
    image: jinni-api
    env_file: *api-envfile
    environment: *api-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    build: ./superapp-backend
    image: jinni-api
    restart: unless-stopped
    env_file: *api-envfile
    environment: *api-env
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:8000:8000"   # direct API access from the host only

  admin:
    build: ./superapp-admin
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "8080:80"

volumes:
  pgdata:
  redisdata:
