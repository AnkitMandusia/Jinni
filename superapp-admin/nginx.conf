server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;   # product image uploads

    location = /healthz { access_log off; return 200 "ok\n"; }

    # API + WebSocket (/api/v1/realtime/ws) -> FastAPI
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;   # long-lived websockets
    }
    location = /health { proxy_pass http://api:8000/health; }

    # Hashed build assets: cache hard. index.html: never.
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }
}

map $http_upgrade $connection_upgrade { default upgrade; '' close; }
